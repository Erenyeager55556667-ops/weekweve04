name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#12141a' --splashBackgroundColor '#12141a'

      - name: Sync web files
        run: npx cap sync android

      - name: Keyboard resize and signing key
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          grep -q windowSoftInputMode $MF || sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"/' $MF
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekweave-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
